debug: false

spring:
  application:
    name: travelApp
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/travel_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:src/main/resources/serviceAccountKey.json}
  database-url: ${FIREBASE_DATABASE_URL:PASTE_FIREBASE_REALTIME_DATABASE_URL}

jwt:
  secret: ${JWT_SECRET:CHANGE_ME_FOR_LOCAL_DEVELOPMENT}
  expiration: ${JWT_EXPIRATION:86400000}
